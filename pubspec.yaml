name: salon_booking
description: "Prenotazioni Alessio Garreffa Hair"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  go_router: ^18.0.0
  http: ^1.6.0
  intl: ^0.20.3
  onesignal_flutter: ^5.6.8
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/agh_primary.png
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Variable.ttf
